<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Carrier Strike 0.40 WebGL Lab</title><style> *{box-sizing:border-box}body{margin:0;background:#172b3b;color:white;font:14px system-ui;overflow:hidden;touch-action:none;user-select:none}canvas{display:block;touch-action:none}#hud{position:fixed;top:16px;left:16px;right:16px;pointer-events:none;text-shadow:0 2px 4px black}#controls{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:18px;right:18px;display:flex;align-items:center;justify-content:space-between;gap:12px}#stick{width:116px;height:116px;border:2px solid #bde4ed;border-radius:50%;background:#102e4488;position:relative;touch-action:none}#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;background:#bde4ed;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}button,a{background:#173d50;color:white;border:1px solid #a7d8e7;padding:12px;border-radius:10px;font: bold 14px system-ui;text-decoration:none}#error{position:fixed;inset:20%;display:none;background:#182c40;padding:20px}</style><div id="hud"><b>CARRIER STRIKE · 0.40 WEBGL LAB</b><p id="status">3D motoru yükleniyor…</p><a href="./">Eski oyuna dön</a></div><div id="controls"><div id="stick"><div id="knob"></div></div><button id="camera">KAMERA</button><button id="launch">KALKIŞ</button></div><div id="error">3D motoru yüklenemedi. İnternet bağlantısını veya WebGL desteğini kontrol et. <a href="./">Eski oyun</a></div><script type="module">
try{
const T=await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
const scene=new T.Scene();scene.background=new T.Color(0x9ab9cf);scene.fog=new T.FogExp2(0x9ab9cf,.00065);
const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.prepend(renderer.domElement);
const cam=new T.PerspectiveCamera(60,innerWidth/innerHeight,.5,5000);
scene.add(new T.HemisphereLight(0xc8e4ff,0x52634a,2));const sun=new T.DirectionalLight(0xffdfb0,3);sun.position.set(-120,180,70);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-180,right:180,top:180,bottom:-180,far:500});scene.add(sun);
const mat=(color,metalness=.1,roughness=.7)=>new T.MeshStandardMaterial({color,metalness,roughness});
const steel=mat(0x8796a0,.65,.35),dark=mat(0x303d45,.4),deck=mat(0x555e63),white=mat(0xd6d8ce),glass=mat(0x254c65,.7,.16);
function mesh(parent,geo,m,x,y,z){let o=new T.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function box(p,x,y,z,w,h,d,m){return mesh(p,new T.BoxGeometry(w,h,d),m,x,y,z)}
const seaGeo=new T.PlaneGeometry(6000,6000,100,100);seaGeo.rotateX(-Math.PI/2);const sea=mesh(scene,seaGeo,mat(0x235b75,.35,.28),0,-2,0);sea.castShadow=false;
const carrier=new T.Group();scene.add(carrier);box(carrier,0,2,0,48,8,250,dark);box(carrier,0,7,0,65,2,270,deck);for(let i=-120;i<125;i+=16)box(carrier,0,8.03,i,.5,.06,8,white);for(let k of [-1,1])box(carrier,k*26,8.03,0,.45,.06,260,white);box(carrier,23,14,-30,12,12,32,steel);box(carrier,23,22,-30,9,4,18,glass);box(carrier,23,29,-30,.5,12,.5,dark);box(carrier,23,33,-30,9,.5,2,dark);
const jet=new T.Group();scene.add(jet);const fus=mesh(jet,new T.SphereGeometry(1,24,16),steel,0,0,0);fus.scale.set(1.65,1.25,7);const nose=mesh(jet,new T.ConeGeometry(1.25,5,24),steel,0,0,-6.2);nose.rotation.x=-Math.PI/2;const canopy=mesh(jet,new T.SphereGeometry(1,24,16),glass,0,1,-2);canopy.scale.set(.85,.75,2.5);
for(let k of [-1,1]){let s=new T.Shape();s.moveTo(k*.9,-3);s.lineTo(k*7,2.8);s.lineTo(k*6,4);s.lineTo(k*1.2,2);s.closePath();let wing=mesh(jet,new T.ExtrudeGeometry(s,{depth:.18,bevelEnabled:false}),steel,0,0,0);wing.rotation.x=Math.PI/2;let tail=box(jet,k*1.25,1.6,4.5,.2,3.1,2.5,steel);tail.rotation.z=-k*.22;let eng=mesh(jet,new T.CylinderGeometry(.72,.85,2.6,24),dark,k*.95,-.15,4.7);eng.rotation.x=Math.PI/2;let nozzle=mesh(jet,new T.TorusGeometry(.65,.11,8,24),steel,k*.95,-.15,6.05);let wheel=mesh(jet,new T.CylinderGeometry(.42,.42,.25,16),dark,k*1.2,-1.5,1);wheel.rotation.z=Math.PI/2;}
jet.position.set(0,10,-0);const land=new T.Group();scene.add(land);const terrain=new T.PlaneGeometry(1900,1800,65,65);terrain.rotateX(-Math.PI/2);let p=terrain.attributes.position;for(let i=0;i<p.count;i++){let x=p.getX(i),z=p.getZ(i);p.setY(i,Math.max(0,Math.sin(x*.012)*Math.cos(z*.009)*65+35)*Math.min(1,(900-z)/200))}terrain.computeVertexNormals();mesh(land,terrain,mat(0x68774e),0,-1,-1450);for(let i=0;i<22;i++){let x=Math.sin(i*2.4)*180,z=-850-i*35;box(land,x,6,z,18,12,22,steel)}
let id=null,jx=0,jy=0,launched=false,speed=0,view=0;const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');function move(e){let b=stick.getBoundingClientRect(),x=(e.clientX-b.left-b.width/2)/40,y=(e.clientY-b.top-b.height/2)/40,m=Math.max(1,Math.hypot(x,y));jx=x/m;jy=-y/m;knob.style.transform='translate(calc(-50% + '+jx*35+'px),calc(-50% + '+(-jy*35)+'px))'}function release(){id=null;jx=jy=0;knob.style.transform='translate(-50%,-50%)'}stick.onpointerdown=e=>{if(id!==null)return;e.preventDefault();id=e.pointerId;try{stick.setPointerCapture(id)}catch(_){}move(e)};window.addEventListener('pointermove',e=>{if(e.pointerId===id)move(e)});for(let n of ['pointerup','pointercancel','lostpointercapture'])window.addEventListener(n,e=>{if(e.pointerId===id)release()});window.addEventListener('blur',release);for(let n of ['gesturestart','gesturechange','touchmove','dblclick'])document.addEventListener(n,e=>e.preventDefault(),{passive:false});document.querySelector('#launch').onclick=()=>{launched=true};document.querySelector('#camera').onclick=()=>view=(view+1)%2;window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
let last=performance.now();function frame(now){let dt=Math.min(.04,(now-last)/1000);last=now;if(launched){speed=Math.min(85,speed+dt*22);jet.position.z-=speed*dt;jet.position.x+=jx*dt*35;if(speed>25)jet.position.y=Math.max(10,Math.min(220,jet.position.y+jy*dt*32));jet.rotation.z=-jx*.35;jet.rotation.x=jy*.18;if(jet.position.z< -2200){jet.position.set(0,10,0);speed=0;launched=false;release()}}let target=jet.position.clone().add(new T.Vector3(view?0:0,view?2:7,view?-1:20));cam.position.lerp(target,1-Math.exp(-dt*8));cam.lookAt(jet.position.clone().add(new T.Vector3(0,view?1:0,-30)));document.querySelector('#status').textContent='GRAFİK TESTİ · HIZ '+Math.round(speed)+' · İRTİFA '+Math.round(jet.position.y)+' · '+(launched?'Joystick yukarı: yüksel':'Kalkışa hazır');renderer.render(scene,cam);requestAnimationFrame(frame)}cam.position.set(0,17,20);requestAnimationFrame(frame);
}catch(e){document.querySelector('#error').style.display='block';console.error(e)}
</script></html>
